<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Ad Factory · Connect Kie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f9;color:#211d2a;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}main{background:white;border:1px solid #e5e0ec;border-radius:24px;padding:40px;max-width:560px;width:100%;box-shadow:0 12px 40px #28183b09}.eyebrow{font-size:12px;letter-spacing:.14em;color:#665573;font-weight:700}h1{font-size:32px;letter-spacing:-.04em;margin-bottom:12px}p{line-height:1.6;color:#6b6474}label{display:block;font-weight:600;margin:28px 0 10px}input{width:100%;padding:15px;border:1px solid #c9c0d1;border-radius:10px;font:inherit}button{width:100%;padding:15px;background:#48345f;color:white;border:0;border-radius:10px;margin-top:14px;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.6}.foot{font-size:12px;margin-bottom:0}.step{font-size:13px;color:#756982}#status{min-height:30px;margin-top:20px;font-size:14px}a{color:#48345f}
</style>
<main><div class="eyebrow">MIKO · AI AD FACTORY</div><h1>Connect Kie</h1><div class="step">Step 1 of 2 · Whop connects next</div><p>Connect your Kie account to get started. Your API key is stored securely on your device and is never shared in chat.</p><form id="form" autocomplete="off"><label for="key">Kie API key</label><input id="key" name="key" type="password" autocomplete="off" spellcheck="false" required placeholder="Paste your key here"><button id="connect">Connect securely</button></form><div id="status" role="status" aria-live="polite"></div></main>
<script>
const token='__TOKEN__', form=document.getElementById('form'), field=document.getElementById('key'), button=document.getElementById('connect'), status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Checking Kie connection…';let secret=field.value;field.value='';try{const response=await fetch('/'+token+'/connect',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':token},body:JSON.stringify({key:secret})});secret='';const result=await response.json();if(!response.ok)throw Error(result.error);status.textContent='Kie connected. Continue in chat to connect Whop.';form.hidden=true;}catch(error){secret='';status.textContent='Could not connect. Check your API key and allow access to secure credential storage. On Linux, an unlocked Secret Service is required.';button.disabled=false;}});
</script></html>
